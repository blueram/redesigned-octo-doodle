<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>MiniGame 3종 PC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn hidden" aria-label="홈으로">←</button>
    <div>
      <h1>MiniGame</h1>
      <p id="subtitle">PC와 함께 즐기는 3가지 미니게임</p>
    </div>
  </header>

  <main>
    <section id="homeScreen" class="screen active">
      <div class="game-grid">
        <button class="game-card" data-game="ox">
          <span class="emoji">⭕</span>
          <strong>OX 이동식 게임</strong>
          <small>3개를 놓은 뒤 말을 이동하며 PC와 대결</small>
        </button>
        <button class="game-card" data-game="chosung">
          <span class="emoji">🔤</span>
          <strong>초성 퀴즈</strong>
          <small>힌트를 보고 정답을 입력하는 10문제</small>
        </button>
        <button class="game-card featured" data-game="fortress">
          <span class="emoji">💥</span>
          <strong>포트리스 PC 대전</strong>
          <small>탱크 이동·각도·파워 조절로 PC를 격파</small>
        </button>
      </div>
    </section>

    <section id="oxScreen" class="screen">
      <div class="panel">
        <div class="status-row">
          <span id="oxStatus">내 차례입니다.</span>
          <button id="oxReset">새 게임</button>
        </div>
        <div id="oxBoard" class="ox-board" aria-label="OX 게임판"></div>
        <p class="help">내 말은 X입니다. 처음 3개를 놓은 뒤에는 내 말을 누르고 빈칸을 눌러 이동하세요.</p>
      </div>
    </section>

    <section id="chosungScreen" class="screen">
      <div class="panel quiz-panel">
        <div class="status-row">
          <span id="quizProgress">1 / 10</span>
          <strong id="quizScore">점수 0</strong>
        </div>
        <div class="quiz-box">
          <p id="quizCategory" class="tag">카테고리</p>
          <div id="quizInitial" class="initial">ㅊㅅ</div>
          <p id="quizHint" class="hint">힌트</p>
          <input id="quizAnswer" type="text" placeholder="정답 입력" autocomplete="off">
          <div class="button-row">
            <button id="quizSubmit" class="primary">정답 확인</button>
            <button id="quizSkip">건너뛰기</button>
          </div>
          <p id="quizMessage" class="message"></p>
        </div>
        <button id="quizRestart" class="hidden">다시 시작</button>
      </div>
    </section>

    <section id="fortressScreen" class="screen">
      <div class="fortress-wrap">
        <div class="fortress-head">
          <div>
            <strong id="fortressTurn">내 차례</strong>
            <span id="fortressMessage">각도와 파워를 조절해 발사하세요.</span>
          </div>
          <button id="fortressReset">새 게임</button>
        </div>

        <div class="health-row">
          <div class="health-box"><span>나</span><div class="health-track"><i id="playerHp"></i></div><b id="playerHpText">100</b></div>
          <div class="health-box"><span>PC</span><div class="health-track"><i id="aiHp"></i></div><b id="aiHpText">100</b></div>
        </div>

        <canvas id="fortressCanvas" width="1000" height="520"></canvas>

        <div class="control-panel">
          <div class="control-group">
            <label>탱크 이동</label>
            <div class="button-row">
              <button class="hold-btn" data-action="moveLeft">◀ 왼쪽</button>
              <button class="hold-btn" data-action="moveRight">오른쪽 ▶</button>
            </div>
          </div>
          <div class="control-group">
            <label>각도 <b id="angleValue">45°</b></label>
            <div class="button-row">
              <button class="hold-btn" data-action="angleDown">−</button>
              <button class="hold-btn" data-action="angleUp">＋</button>
            </div>
          </div>
          <div class="control-group">
            <label>파워 <b id="powerValue">60</b></label>
            <div class="button-row">
              <button class="hold-btn" data-action="powerDown">−</button>
              <button class="hold-btn" data-action="powerUp">＋</button>
            </div>
          </div>
          <button id="fireBtn" class="fire-btn">🔥 발사</button>
        </div>
        <p class="help">버튼을 한 번 누르면 1단계, 길게 누르면 계속 1단계씩 조절됩니다. 더블클릭 확대는 차단되어 있습니다.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
